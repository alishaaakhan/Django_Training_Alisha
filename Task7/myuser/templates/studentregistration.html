<!DOCTYPE html>

{% load static %}

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Inter, Arial, sans-serif;
    }


    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        position: relative;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 15% 20%,
                rgba(129, 140, 248, 0.28),
                transparent 35%
            ),
            radial-gradient(
                circle at 85% 75%,
                rgba(96, 165, 250, 0.25),
                transparent 35%
            ),
            linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc,
                #e0f2fe
            );
    }


    /* Background blur */

    .blur {
        position: absolute;

        border-radius: 50%;

        filter: blur(75px);

        opacity: 0.55;

        animation: floating 8s ease-in-out infinite;
    }


    .blur-one {
        width: 280px;
        height: 280px;

        background: #c4b5fd;

        top: -90px;
        left: -70px;
    }


    .blur-two {
        width: 330px;
        height: 330px;

        background: #bae6fd;

        right: -100px;
        bottom: -120px;

        animation-delay: 2s;
    }


    .blur-three {
        width: 160px;
        height: 160px;

        background: #ddd6fe;

        right: 18%;
        top: 12%;

        animation-delay: 4s;
    }


    @keyframes floating {

        0%, 100% {
            transform: translate(0, 0);
        }

        50% {
            transform: translate(20px, -20px);
        }

    }


    /* Logout */

    .logout {
        position: absolute;

        top: 28px;
        right: 32px;

        z-index: 5;

        padding: 10px 18px;

        border-radius: 10px;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        color: #475569;

        background: rgba(255, 255, 255, 0.55);

        border: 1px solid rgba(255, 255, 255, 0.75);

        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        box-shadow:
            0 8px 20px rgba(71, 85, 105, 0.10);

        transition:
            background 0.3s ease,
            transform 0.3s ease,
            box-shadow 0.3s ease;
    }


    .logout:hover {
        transform: translateY(-2px);

        background: rgba(255, 255, 255, 0.82);

        box-shadow:
            0 12px 25px rgba(71, 85, 105, 0.15);

        color: #dc2626;
    }


    /* Main Card */

    .container {
        width: 90%;
        max-width: 500px;

        padding: 45px 42px;

        position: relative;
        z-index: 2;

        text-align: center;

        background: rgba(255, 255, 255, 0.48);

        border: 1px solid rgba(255, 255, 255, 0.75);

        border-radius: 25px;

        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);

        box-shadow:
            0 25px 70px rgba(71, 85, 105, 0.16),
            inset 0 1px 1px rgba(255, 255, 255, 0.85);

        animation: cardEntry 0.7s ease;
    }


    @keyframes cardEntry {

        from {
            opacity: 0;
            transform: translateY(25px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

    }


    /* Heading */

    h1 {
        color: #1e293b;

        font-size: 32px;

        font-weight: 700;

        letter-spacing: -0.6px;

        margin-bottom: 9px;
    }


    .subtitle {
        color: #64748b;

        font-size: 14px;

        line-height: 1.6;

        margin-bottom: 28px;
    }


    /* Form */

    form {
        text-align: left;
    }


    .form-group {
        margin-bottom: 18px;
    }


    label {
        display: block;

        margin-bottom: 7px;

        color: #334155;

        font-size: 14px;

        font-weight: 600;
    }


    /* Input */

    input {
        width: 100%;

        padding: 13px 14px;

        border-radius: 11px;

        border: 1px solid rgba(148, 163, 184, 0.35);

        outline: none;

        color: #1e293b;

        font-size: 14px;

        background: rgba(255, 255, 255, 0.58);

        transition:
            border 0.25s ease,
            box-shadow 0.25s ease,
            background 0.25s ease;
    }


    input::placeholder {
        color: #94a3b8;
    }


    input:hover {
        background: rgba(255, 255, 255, 0.75);
    }


    input:focus {
        background: rgba(255, 255, 255, 0.88);

        border-color: rgba(99, 102, 241, 0.65);

        box-shadow:
            0 0 0 4px rgba(99, 102, 241, 0.10);
    }


    /* Save Button */

    button[type="submit"] {
        width: 100%;

        margin-top: 5px;

        padding: 13px;

        border: none;

        border-radius: 11px;

        cursor: pointer;

        color: white;

        font-size: 15px;

        font-weight: 600;

        background: linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

        box-shadow:
            0 9px 22px rgba(99, 102, 241, 0.25);

        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease;
    }


    button[type="submit"]:hover {
        transform: translateY(-2px);

        box-shadow:
            0 14px 28px rgba(99, 102, 241, 0.32);
    }


    button[type="submit"]:active {
        transform: translateY(0);
    }


    /* Responsive */

    @media (max-width: 600px) {

        .container {
            padding: 38px 25px;
        }

        h1 {
            font-size: 28px;
        }

        .logout {
            top: 18px;
            right: 18px;

            padding: 9px 14px;

            font-size: 13px;
        }

    }

</style>


</head>

<body>

<!-- Background -->

<div class="blur blur-one"></div>
<div class="blur blur-two"></div>
<div class="blur blur-three"></div>


<!-- Logout -->

<a href="{% url 'logout' %}"
   class="logout">
    Log out
</a>


<!-- Registration Card -->

<div class="container">

    <h1>
        Student Registration
    </h1>

    <p class="subtitle">
        Enter the student's details below.
    </p>


    <form action="{% url 'savestudent' %}"
          method="post">

        {% csrf_token %}


        <div class="form-group">

            <label for="student_name">
                Student Name
            </label>

            <input
                type="text"
                name="student_name"
                id="student_name"
                placeholder="Enter student name"
                required
            >

        </div>


        <div class="form-group">

            <label for="student_id">
                Student ID
            </label>

            <input
                type="text"
                name="student_id"
                id="student_id"
                placeholder="Enter student ID"
                required
            >

        </div>


        <div class="form-group">

            <label for="branch">
                Branch
            </label>

            <input
                type="text"
                name="branch"
                id="branch"
                placeholder="e.g. CSE, AI&DS, IT"
                required
            >

        </div>


        <button type="submit">
            Save Student
        </button>


    </form>

</div>

</body>

</html>
