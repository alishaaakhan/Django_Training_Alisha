
<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login</title>

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

</head>

<body>

    <div class="container login-container">

        <div class="icon">
            🔐
        </div>

        <h1>
            Student Login
        </h1>

        <p class="subtitle">
            Login to continue to placement prediction
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form
            action="{% url 'login' %}"
            method="POST"
        >

            {% csrf_token %}


            <div class="input-group">

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <input
                type="submit"
                value="Login"
            >

        </form>


        <p class="bottom-text">

            Don't have an account?

            <a href="{% url 'studentregister' %}">
                Create New Account
            </a>

        </p>

    </div>

</body>

</html>
