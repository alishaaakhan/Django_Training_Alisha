<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glass Type Prediction</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Glass Type Prediction</h1>

        <p class="subtitle">
            Enter the chemical composition values to predict the type of glass.
        </p>

        <form action="{% url 'result' %}" method="GET">

            <div class="input-group">
                <label for="RI">Refractive Index (RI)</label>
                <input
                    type="text"
                    id="RI"
                    name="RI"
                    placeholder="Enter RI"
                    required
                >
            </div>

            <div class="input-group">
                <label for="Na">Sodium (Na)</label>
                <input
                    type="text"
                    id="Na"
                    name="Na"
                    placeholder="Enter Na"
                    required
                >
            </div>

            <div class="input-group">
                <label for="Mg">Magnesium (Mg)</label>
                <input
                    type="text"
                    id="Mg"
                    name="Mg"
                    placeholder="Enter Mg"
                    required
                >
            </div>

            <div class="input-group">
                <label for="Al">Aluminum (Al)</label>
                <input
                    type="text"
                    id="Al"
                    name="Al"
                    placeholder="Enter Al"
                    required
                >
            </div>

            <div class="input-group">
                <label for="Si">Silicon (Si)</label>
                <input
                    type="text"
                    id="Si"
                    name="Si"
                    placeholder="Enter Si"
                    required
                >
            </div>

            <div class="input-group">
                <label for="K">Potassium (K)</label>
                <input
                    type="text"
                    id="K"
                    name="K"
                    placeholder="Enter K"
                    required
                >
            </div>

            <div class="input-group">
                <label for="Ca">Calcium (Ca)</label>
                <input
                    type="text"
                    id="Ca"
                    name="Ca"
                    placeholder="Enter Ca"
                    required
                >
            </div>

            <div class="input-group">
                <label for="Ba">Barium (Ba)</label>
                <input
                    type="text"
                    id="Ba"
                    name="Ba"
                    placeholder="Enter Ba"
                    required
                >
            </div>

            <div class="input-group">
                <label for="Fe">Iron (Fe)</label>
                <input
                    type="text"
                    id="Fe"
                    name="Fe"
                    placeholder="Enter Fe"
                    required
                >
            </div>

            <input
                type="submit"
                value="Predict Glass Type"
            >

        </form>

    </div>

</body>

</html>
