<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            color: white;

            padding: 25px;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(99,102,241,0.3),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(168,85,247,0.3),
                    transparent 30%
                ),
                #070b18;
        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            pointer-events: none;
        }

        .card {

            width: min(500px, 100%);

            padding: 40px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.15);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.45);

            position: relative;

            z-index: 2;
        }

        .header {

            text-align: center;

            margin-bottom: 32px;
        }

        .icon {

            width: 60px;

            height: 60px;

            margin: 0 auto 18px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 17px;

            background:
                rgba(99,102,241,0.12);

            border:
                1px solid
                rgba(99,102,241,0.25);

            color: #a5b4fc;

            font-size: 28px;
        }

        h1 {

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {

            color:
                rgba(255,255,255,0.42);

            font-size: 13px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color:
                rgba(255,255,255,0.65);

            font-size: 12px;
        }

        input {

            width: 100%;

            padding: 14px 15px;

            border-radius: 11px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.055);

            color: white;

            font-size: 13px;

            transition: 0.3s;
        }

        input:focus {

            border-color:
                rgba(99,102,241,0.6);

            background:
                rgba(255,255,255,0.08);

            box-shadow:
                0 0 0 3px
                rgba(99,102,241,0.08);
        }

        input::placeholder {

            color:
                rgba(255,255,255,0.25);
        }

        .actions {

            display: flex;

            gap: 12px;

            margin-top: 28px;
        }

        .btn {

            flex: 1;

            padding: 14px;

            border-radius: 11px;

            text-decoration: none;

            text-align: center;

            font-size: 13px;

            font-weight: 600;

            transition: 0.3s;

            cursor: pointer;
        }

        .cancel {

            color:
                rgba(255,255,255,0.65);

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.1);
        }

        .cancel:hover {

            background:
                rgba(255,255,255,0.1);

            color: white;
        }

        .save {

            border: none;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );
        }

        .save:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(99,102,241,0.3);
        }

        @media (max-width: 500px) {

            .card {

                padding: 28px 22px;
            }

            .actions {

                flex-direction: column;
            }
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="header">

            <div class="icon">
                +
            </div>

            <h1>
                Add Product
            </h1>

            <p class="subtitle">
                Enter product details to create a new record
            </p>

        </div>


        <form
            action="{% url 'create' %}"
            method="post"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="p_name">
                    Product Name
                </label>

                <input
                    type="text"
                    name="p_name"
                    id="p_name"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="p_price">
                    Product Price
                </label>

                <input
                    type="number"
                    name="p_price"
                    id="p_price"
                    placeholder="Enter product price"
                    required
                >

            </div>


            <div class="form-group">

                <label for="p_offer">
                    Product Offer
                </label>

                <input
                    type="text"
                    name="p_offer"
                    id="p_offer"
                    placeholder="Example: 10%"
                    required
                >

            </div>


            <div class="actions">

                <a
                    href="{% url 'home' %}"
                    class="btn cancel"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn save"
                >
                    Save Product
                </button>

            </div>

        </form>

    </div>

</body>

</html>
